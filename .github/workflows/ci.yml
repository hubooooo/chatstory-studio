name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npx tsx scripts/security.ts
      - name: Install CJK system font for Linux rendering
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Deterministic render without network TTS
        run: npx tsx tests/ci-render.ts
      - uses: actions/upload-artifact@v4
        with:
          name: media-${{ runner.os }}
          path: |
            outputs/ci-smoke.mp4
            outputs/ci-smoke.validation.json
            outputs/ci-smoke.log
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete Git history, including the root commit
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.3
        with:
          args: git --redact --log-opts=--all --report-format=sarif --report-path=results.sarif .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan
          path: results.sarif
